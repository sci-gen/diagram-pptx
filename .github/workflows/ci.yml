name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest -m "not official" --cov=diagram_pptx --cov-report=term-missing

  official:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Test pinned Mermaid CLI integration
        run: docker compose run --build --rm official-test

      - name: Render five-family PPTX/PDF/PNG gallery
        run: docker compose run --rm example

      - uses: actions/upload-artifact@v6
        with:
          name: diagram-gallery
          path: artifacts/

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build ruff twine

      - name: Validate clean wheel installation
        run: bash scripts/release_smoke.sh

      - name: Build upload artifacts
        run: python -m build

      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/
