[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "diagram-pptx"
version = "0.1.0a1"
description = "Compile Mermaid into editable native PowerPoint diagrams with python-pptx"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "diagram-pptx contributors" },
]
keywords = ["powerpoint", "pptx", "mermaid", "diagram", "flowchart"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Office Suites",
  "Typing :: Typed",
]
dependencies = [
  "networkx>=3.2,<4",
  "python-pptx>=1.0.2,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "Pillow>=10,<13",
  "ruff>=0.6,<1",
  "twine>=5,<7",
]

[project.scripts]
diagram-pptx = "diagram_pptx.cli:main"

[project.urls]
Homepage = "https://github.com/sci-gen/diagram-pptx"
Repository = "https://github.com/sci-gen/diagram-pptx"
Issues = "https://github.com/sci-gen/diagram-pptx/issues"
Changelog = "https://github.com/sci-gen/diagram-pptx/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/diagram_pptx"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "official: requires the pinned Mermaid CLI and Chromium runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
