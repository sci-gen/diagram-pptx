[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "diagram-pptx"
version = "0.1.0"
description = "Extensible diagram IR, layout engines, and native PowerPoint rendering for python-pptx"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "diagram-pptx contributors" },
]
keywords = ["powerpoint", "pptx", "mermaid", "diagram", "flowchart"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = [
  "networkx>=3.2,<4",
  "python-pptx>=1.0.2,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "twine>=5,<7",
]

[project.scripts]
diagram-pptx = "diagram_pptx.cli:main"

[project.urls]
Homepage = "https://github.com/sci-gen/diagram-pptx"
Repository = "https://github.com/sci-gen/diagram-pptx"
Issues = "https://github.com/sci-gen/diagram-pptx/issues"
Changelog = "https://github.com/sci-gen/diagram-pptx/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/diagram_pptx"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
